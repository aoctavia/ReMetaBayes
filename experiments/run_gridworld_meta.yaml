experiment:
  name: remetabayes_meta
  total_episodes: 5000
  max_steps_per_episode: 50
  seed: 42
  log_interval: 50

environment:
  name: gridworldshift
  size: 5
  shift_interval: 75
  seed: 0

agent:
  latent_dim: 16
  hidden_dim: 128
  lr: 0.0003
  beta_kl: 0.001
  gamma: 0.99

meta_learning:
  n_tasks: 5
  adaptation_episodes: 2
  beta_kl_z: 0.001

logging:
  save_path: results_meta/
